[package]
name = "omnissiah"
version = "2.1.0"
edition = "2021"

[lib]
name = "omnissiah"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "multiple-pymethods"] }
numpy = "0.22"
rayon = "1.10"
turbojpeg = { version = "1", default-features = false, features = ["cmake", "pkg-config", "require-simd"] }
memmap2 = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
jpeg2k = { version = "0.10", default-features = false, features = ["openjpeg-sys"] }
